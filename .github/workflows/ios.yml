name: build-ipa

# ⚠️ 这条现在是废的，别指望它出包。2026-11-15 查过：
#   1) 它在仓库根目录跑，根目录的 Sources/ 里有两个 @main
#      （AqianApp.swift 和 AqianClientApp.swift），必然编译冲突；
#   2) 下面写死 -project Aqian.xcodeproj，但根目录 project.yml 的 name 是 AqianClient，
#      实际生成的是 AqianClient.xcodeproj，工程名对不上直接报 does not exist。
#   真正能出包的是 build-client.yml（接 DSH 那边）和 build-near.yml（接这边）。
# 这里只加 paths 限制，免得每次推别的目录都白跑一次失败。
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "project.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project Aqian.xcodeproj             -scheme Aqian             -sdk iphoneos             -configuration Release             -archivePath build/Aqian.xcarchive             archive             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM=""             | tail -n 60

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Aqian.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Aqian-unsigned.ipa Payload
          ls -lh Aqian-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Aqian-unsigned-ipa
          path: Aqian-unsigned.ipa
          retention-days: 30
